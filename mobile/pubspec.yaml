name: hopely_care
description: Patient-controlled psycho-oncology wellbeing companion.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.10.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  dio: ^5.9.0
  flutter_secure_storage: ^11.2.0
  intl: ^0.20.2
  pdf: ^3.11.3
  printing: ^5.14.2
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/fonts/DejaVuSans.ttf
  fonts:
    - family: DejaVuSans
      fonts:
        - asset: assets/fonts/DejaVuSans.ttf

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "hopely-ai"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi==0.142.2", "pydantic>=2.13,<3", "pydantic-settings==2.15.0", "httpx[socks]==0.28.1", "uvicorn==0.54.0", "numpy>=2.3,<3", "pandas>=2.2,<3", "scikit-learn>=1.8,<2", "qdrant-client==1.19.1", "openai==3.26.0", "pypdf>=6,<7"]
[project.optional-dependencies]
ml = ["sentence-transformers>=5,<6", "transformers>=4.50,<6"]
dev = ["pytest==9.1.1", "ruff>=0.14"]
[tool.setuptools.packages.find]
include = ["app*"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

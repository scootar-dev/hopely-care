<!-- Top Minimal Header -->
<div class="flex items-center justify-between pt-space-sm pb-space-md">
<div class="flex items-center gap-space-xs">
<div class="w-8 h-8 rounded-xl bg-surface-container-high flex items-center justify-center text-primary">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">favorite</span>
</div>
<span class="font-headline-md-mobile text-headline-md-mobile text-on-surface tracking-tight font-bold">Hopely<span class="text-primary font-normal">Care</span></span>

<div class="flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-surface-container-low text-tertiary">
<span class="w-2 h-2 rounded-full bg-secondary animate-pulse"></span>
<span class="font-label-sm text-label-sm text-on-surface-variant font-medium">Ruang Teduh</span>
</div>
</div>
<!-- Warm Minimalist 3D Illustration Canvas -->
<div class="relative w-full aspect-square max-w-[340px] mx-auto my-space-sm flex items-center justify-center">
<!-- Ambient gentle glow behind image -->
<div class="absolute inset-4 rounded-full bg-gradient-to-tr from-surface-container-highest via-primary-fixed to-surface-container-low blur-2xl opacity-60 pointer-events-none"></div>
<!-- Image Card Container -->
<div class="relative w-full h-full rounded-[28px] overflow-hidden bg-surface-container-lowest shadow-md flex items-center justify-center">
<img alt="Hopely Care Warm Support" class="w-full h-full object-cover object-center transform transition-transform duration-700 hover:scale-105" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCwHBopKTVXXf1DqRGJf31oDLHFXCQJ0DGVCf_VqhleJrPeJI6L7EpBi3vT_JN211yyISXp-uat4V6GlD97aLZHdGaoEf56Vb4L1MGBtxv5VECbhFCJYSGkyHY-2lgN1TDEcXeDP5Sw34_TO0pGkSmfuN0OxMfU-VFbp0V9ippua7v0AVlxWDvi2lx807oYxo0E_yDUpubYtt3dzDp6TG7vrOcMLL0V7uRWiRFR0gZudiSSh9tqxAhE">
<!-- Soft gradient overlay at bottom edge of image -->
<div class="absolute inset-x-0 bottom-0 h-16 bg-gradient-to-t from-surface-container-lowest/80 to-transparent pointer-events-none"></div>
</div>
</div>
<!-- Empathy Messaging Hierarchy -->
<div class="flex flex-col items-center text-center px-space-xs mt-space-md mb-space-lg">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface font-bold tracking-tight leading-snug">
      Kamu tidak harus melewati semuanya sendirian.
    </h1>
<p class="font-body-md text-body-md text-on-surface-variant max-w-xs mt-space-sm leading-relaxed">
      Ruang aman dan pendamping penuh empati untuk mendampingi setiap fase pemulihanmu.
    </p>
</div>
<!-- Bottom Single-Purpose Action Dock -->
<div class="flex flex-col w-full gap-3 mt-auto">
<!-- Primary CTA -->
<button class="w-full h-14 bg-primary text-on-primary font-label-lg text-label-lg rounded-2xl shadow-sm hover:bg-secondary active:scale-[0.99] transition-all duration-200 flex items-center justify-center gap-2 group cursor-pointer" id="start-button" type="button">
<span>Mulai Sekarang</span>
<span class="material-symbols-outlined text-[20px] transition-transform duration-200 group-hover:translate-x-1">arrow_forward</span>
</button>
<!-- Secondary CTA -->
<button class="w-full h-14 bg-surface-container-low text-primary font-label-lg text-label-lg rounded-2xl hover:bg-surface-container active:scale-[0.99] transition-all duration-200 flex items-center justify-center cursor-pointer" id="login-button" type="button">
<span>Masuk</span>
</button>
</div>
</div>
<script>
  // Subtle tactile feedback for mobile touch
  const buttons = document.querySelectorAll('#start-button, #login-button');
  buttons.forEach(btn => {
    btn.addEventListener('touchstart', () => {
      btn.style.opacity = '0.92';
    });
    btn.addEventListener('touchend', () => {
      btn.style.opacity = '1';
    });
  });
</script></main></body></html>

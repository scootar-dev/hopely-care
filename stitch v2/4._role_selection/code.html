</head><body class="bg-surface font-body-md text-body-md text-on-surface flex flex-col min-h-screen"><header class="fixed top-0 w-full z-50 bg-surface/80 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.04)] pt-safe"><div class="h-14 px-margin-mobile flex items-center justify-between"><div class="flex items-center gap-space-xs"><button aria-label="Kembali" class="w-11 h-11 flex items-center justify-center rounded-full text-on-surface hover:bg-surface-container-low transition-colors" onclick="history.back()"><span class="material-symbols-outlined text-[22px]">arrow_back</span></button><h1 class="font-headline-md-mobile text-headline-md-mobile text-on-surface">Daily Check In</h1></div><div class="flex items-center gap-space-xs"><button aria-label="Tutup" class="w-11 h-11 flex items-center justify-center rounded-full text-on-surface-variant hover:bg-surface-container-low transition-colors" onclick="history.back()"><span class="material-symbols-outlined text-[20px]">close</span></button><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></div></header><main class="flex flex-col relative w-full pt-14 pb-safe bg-surface min-h-screen"><div class="flex flex-col w-full">
<div class="px-margin-mobile pt-space-lg pb-space-xl flex flex-col justify-between">
<!-- Header Section -->
<div class="flex flex-col gap-space-xs">
<div class="flex items-center gap-space-xs mb-space-xs">
<span class="w-2 h-2 rounded-full bg-primary animate-pulse"></span>
<span class="font-label-sm text-label-sm text-primary tracking-wide uppercase">Langkah 1 dari 3</span>
</div>
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">
        Kamu menggunakan Hopely sebagai?
      </h2>
<p class="font-body-md text-body-md text-on-surface-variant mt-1">
        Pilih peran untuk menyesuaikan pengalaman pendampinganmu.
      </p>
</div>
<!-- Visual Empathy Accent Illustration -->
<div class="my-space-lg w-full rounded-2xl bg-surface-container-low overflow-hidden relative shadow-sm">
<div class="relative h-36 w-full overflow-hidden">
<img class="w-full h-full object-cover mix-blend-multiply opacity-90" data-alt="A warm, minimal, gentle watercolor illustration depicting two caring hands gently cradling a glowing soft blue heart. Calming ambient daylight, pastel blue and subtle ivory tones, evoking peaceful emotional oncology recovery and supportive compassionate companionship." src="https://lh3.googleusercontent.com/aida-public/AB6AXuC7KFoc3n9NDJq0KlX7IQccqftnRPRNZ-IOLGUEU_fovKMu-xCHI_yooSiAzmPBVtv9wCpduatPinsgzmJF84iI5gmQUBnT6fzujelVQtxPasNej6B_9MzwOE_10nzz77UNKRHAe1W-dY-US123fqKa80u6kIVveQoObaYaCJf_XRdz16pKF6qMUoVKuHUfzLm8g03g3lh3g9oW9jV6J3a17HNR88OmBJgjQWF6OHFlr6idmqw_yygP">
<div class="absolute inset-0 bg-gradient-to-t from-surface-container-low via-transparent to-transparent"></div>
<div class="absolute bottom-3 left-4 flex items-center gap-space-xs bg-surface-container-lowest/80 backdrop-blur-md px-3 py-1.5 rounded-full shadow-sm">
<span class="material-symbols-outlined text-primary text-[18px]" style="font-variation-settings: 'FILL' 1;">spa</span>
<span class="font-label-sm text-label-sm text-on-surface">Ruang Tenang &amp; Aman</span>
</div>
</div>
</div>
<!-- Interactive Role Cards Container -->
<form class="flex flex-col gap-space-md" id="roleSelectionForm" onsubmit="event.preventDefault(); handleContinue();">
<!-- Option 1: Pasien -->
<label class="group relative flex items-start gap-space-md p-space-lg rounded-2xl bg-surface-container-lowest shadow-sm cursor-pointer transition-all duration-200 active:scale-[0.99] select-none" id="card-patient" onclick="selectRole('patient')">
<input checked="" class="sr-only" name="user_role" type="radio" value="patient">
<!-- Selection Visual Indicator Pill -->
<div class="absolute top-4 right-4 flex items-center justify-center w-6 h-6 rounded-full bg-primary-container text-on-primary shadow-sm transition-all" id="badge-patient">
<span class="material-symbols-outlined text-[16px]">check</span>
</div>
<!-- Empathy Icon Container -->
<div class="w-14 h-14 rounded-2xl bg-primary-fixed flex items-center justify-center text-primary shrink-0 transition-colors duration-200" id="icon-patient">
<span class="material-symbols-outlined text-[28px]" style="font-variation-settings: 'FILL' 1;">favorite</span>
</div>
<!-- Role Information -->
<div class="flex flex-col min-w-0 pr-6">
<span class="font-headline-md text-headline-md text-on-surface group-hover:text-primary transition-colors">
            Pasien
          </span>
<span class="font-body-md text-body-md text-on-surface-variant mt-1 leading-relaxed">
            Saya sedang menjalani masa perawatan atau pemulihan.
          </span>
</div>
</label>
<!-- Option 2: Pendamping -->
<label class="group relative flex items-start gap-space-md p-space-lg rounded-2xl bg-surface-container-lowest shadow-sm cursor-pointer transition-all duration-200 active:scale-[0.99] select-none" id="card-caregiver" onclick="selectRole('caregiver')">
<input class="sr-only" name="user_role" type="radio" value="caregiver">
<!-- Selection Visual Indicator Pill -->
<div class="absolute top-4 right-4 flex items-center justify-center w-6 h-6 rounded-full bg-surface-container-high text-transparent transition-all" id="badge-caregiver">
<span class="material-symbols-outlined text-[16px]">check</span>
</div>
<!-- Empathy Icon Container -->
<div class="w-14 h-14 rounded-2xl bg-surface-container-low flex items-center justify-center text-secondary shrink-0 transition-colors duration-200" id="icon-caregiver">
<span class="material-symbols-outlined text-[28px]" style="font-variation-settings: 'FILL' 1;">volunteer_activism</span>
</div>
<!-- Role Information -->
<div class="flex flex-col min-w-0 pr-6">
<span class="font-headline-md text-headline-md text-on-surface group-hover:text-primary transition-colors">
            Pendamping
          </span>
<span class="font-body-md text-body-md text-on-surface-variant mt-1 leading-relaxed">
            Saya mendampingi keluarga atau kerabat yang sedang berjuang.
          </span>
</div>
</label>
<!-- Bottom Interactive Action Area -->
<div class="flex flex-col gap-space-md pt-space-lg mt-space-sm">
<button class="w-full h-[52px] rounded-2xl bg-primary-container text-on-primary font-label-lg text-label-lg flex items-center justify-center gap-space-xs shadow-md hover:bg-primary active:scale-[0.98] transition-all" id="btn-submit" onclick="handleContinue()" type="button">
<span>Lanjutkan</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
<!-- Reassurance Footer Note -->
<p class="font-body-sm text-body-sm text-outline text-center flex items-center justify-center gap-1.5">
<span class="material-symbols-outlined text-[16px] text-outline">tune</span>
          Peran dapat disesuaikan kembali nanti di menu pengaturan.
        </p>
</div>
</form>
</div>
</div>
<script>
  function selectRole(role) {
    const isPatient = role === 'patient';
    
    const cardPatient = document.getElementById('card-patient');
    const badgePatient = document.getElementById('badge-patient');
    const iconPatient = document.getElementById('icon-patient');
    
    const cardCaregiver = document.getElementById('card-caregiver');
    const badgeCaregiver = document.getElementById('badge-caregiver');
    const iconCaregiver = document.getElementById('icon-caregiver');

    if (isPatient) {
      // Patient Selected
      cardPatient.classList.remove('bg-surface-container-lowest');
      cardPatient.classList.add('bg-surface-container-low', 'shadow-md');
      badgePatient.classList.remove('bg-surface-container-high', 'text-transparent');
      badgePatient.classList.add('bg-primary-container', 'text-on-primary');
      iconPatient.classList.remove('bg-surface-container-low');
      iconPatient.classList.add('bg-primary-fixed');

      // Caregiver Unselected
      cardCaregiver.classList.add('bg-surface-container-lowest');
      cardCaregiver.classList.remove('bg-surface-container-low', 'shadow-md');
      badgeCaregiver.classList.add('bg-surface-container-high', 'text-transparent');
      badgeCaregiver.classList.remove('bg-primary-container', 'text-on-primary');
      iconCaregiver.classList.remove('bg-primary-fixed');
      iconCaregiver.classList.add('bg-surface-container-low');
    } else {
      // Caregiver Selected
      cardCaregiver.classList.remove('bg-surface-container-lowest');
      cardCaregiver.classList.add('bg-surface-container-low', 'shadow-md');
      badgeCaregiver.classList.remove('bg-surface-container-high', 'text-transparent');
      badgeCaregiver.classList.add('bg-primary-container', 'text-on-primary');
      iconCaregiver.classList.remove('bg-surface-container-low');
      iconCaregiver.classList.add('bg-primary-fixed');

      // Patient Unselected
      cardPatient.classList.add('bg-surface-container-lowest');
      cardPatient.classList.remove('bg-surface-container-low', 'shadow-md');
      badgePatient.classList.add('bg-surface-container-high', 'text-transparent');
      badgePatient.classList.remove('bg-primary-container', 'text-on-primary');
      iconPatient.classList.remove('bg-primary-fixed');
      iconPatient.classList.add('bg-surface-container-low');
    }
  }

  function handleContinue() {
    const btn = document.getElementById('btn-submit');
    btn.innerHTML = `<span class="material-symbols-outlined animate-spin text-[20px]">progress_activity</span><span>Menyimpan...</span>`;
    setTimeout(() => {
      btn.innerHTML = `<span>Lanjutkan</span><span class="material-symbols-outlined text-[20px]">arrow_forward</span>`;
    }, 600);
  }

  // Set default initial state visually
  selectRole('patient');
</script></main></body></html>

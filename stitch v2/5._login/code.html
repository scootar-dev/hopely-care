</head><body class="bg-surface font-body-md text-body-md text-on-surface flex flex-col min-h-screen"><header class="fixed top-0 w-full z-50 bg-surface/80 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.04)] pt-safe"><div class="h-14 px-margin-mobile flex items-center justify-between"><div class="flex items-center gap-space-xs"><button aria-label="Kembali" class="w-11 h-11 flex items-center justify-center rounded-full text-on-surface hover:bg-surface-container-low transition-colors" onclick="history.back()"><span class="material-symbols-outlined text-[22px]">arrow_back</span></button><h1 class="font-headline-md-mobile text-headline-md-mobile text-on-surface">Daily Check In</h1></div><div class="flex items-center gap-space-xs"><button aria-label="Tutup" class="w-11 h-11 flex items-center justify-center rounded-full text-on-surface-variant hover:bg-surface-container-low transition-colors" onclick="history.back()"><span class="material-symbols-outlined text-[20px]">close</span></button><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></div></header><main class="flex flex-col relative w-full pt-14 pb-safe bg-surface min-h-screen"><div class="flex flex-col w-full">
<div class="w-full max-w-md mx-auto px-margin-mobile pb-space-xl flex flex-col justify-between pt-space-md">
<!-- Top Warm Brand Anchor -->
<div class="flex flex-col items-center text-center mb-space-lg">
<div class="w-16 h-16 rounded-full bg-primary-fixed flex items-center justify-center shadow-sm mb-space-md">
<span class="material-symbols-outlined text-primary text-[32px]" style="font-variation-settings: 'FILL' 1;">volunteer_activism</span>
</div>
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface tracking-tight">Masuk ke Hopely Care</h2>
<p class="font-body-md text-body-md text-tertiary mt-space-xs max-w-xs">Lanjutkan perjalanan pemulihan dan pendampinganmu.</p>
</div>
<!-- Login Card -->
<div class="bg-surface-container-lowest rounded-xl p-space-lg shadow-sm flex flex-col gap-space-md">
<!-- Input 1: Email -->
<div class="flex flex-col gap-space-xs">
<label class="font-label-md text-label-md text-on-surface" for="email-input">Alamat Email</label>
<div class="relative flex items-center">
<div class="absolute left-space-md flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined text-[20px]">mail</span>
</div>
<input autocomplete="email" class="w-full h-14 bg-surface-container-lowest text-on-surface font-body-lg text-body-lg pl-12 pr-space-md rounded-xl shadow-sm outline-none focus:bg-surface-container-low transition-all placeholder:text-outline-variant" id="email-input" name="email" placeholder="nama@email.com" type="email">
</div>
</div>
<!-- Input 2: Kata Sandi -->
<div class="flex flex-col gap-space-xs">
<div class="flex items-center justify-between">
<label class="font-label-md text-label-md text-on-surface" for="password-input">Kata Sandi</label>
<a class="font-label-md text-label-md text-primary hover:text-primary-container transition-colors" href="#">Lupa kata sandi?</a>
</div>
<div class="relative flex items-center">
<div class="absolute left-space-md flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined text-[20px]">lock</span>
</div>
<input class="w-full h-14 bg-surface-container-lowest text-on-surface font-body-lg text-body-lg pl-12 pr-12 rounded-xl shadow-sm outline-none focus:bg-surface-container-low transition-all placeholder:text-outline-variant" id="password-input" name="password" placeholder="••••••••" type="password">
<button aria-label="Tampilkan atau sembunyikan kata sandi" class="absolute right-space-sm w-10 h-10 flex items-center justify-center text-outline hover:text-on-surface rounded-full transition-colors" id="toggle-password" type="button">
<span class="material-symbols-outlined text-[20px]" id="pwd-icon">visibility</span>
</button>
</div>
</div>
<!-- Submit Button -->
<button class="w-full h-14 mt-space-xs bg-primary-container active:bg-primary text-on-primary rounded-xl font-label-lg text-label-lg flex items-center justify-center gap-space-sm shadow-md transition-all active:scale-[0.99]" id="btn-login" type="button">
<span>Masuk</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
<!-- Bottom Account Switcher -->
<div class="pt-space-xs flex items-center justify-center text-center">
<p class="font-body-md text-body-md text-tertiary">
          Belum punya akun? 
          <a class="font-label-md text-label-md text-primary font-semibold hover:underline ml-space-xs" href="#">Daftar</a>
</p>
</div>
</div>
<!-- Reassurance / Trust Badge -->
<div class="mt-space-lg flex items-center justify-center gap-space-xs px-space-md text-center">
<span class="material-symbols-outlined text-outline text-[18px]">verified_user</span>
<p class="font-body-sm text-body-sm text-tertiary">
        Data kesehatan dan jurnal Anda dilindungi enkripsi aman.
      </p>
</div>
</div>
</div>
<script>
  (function() {
    const toggleBtn = document.getElementById('toggle-password');
    const pwdInput = document.getElementById('password-input');
    const pwdIcon = document.getElementById('pwd-icon');

    if (toggleBtn && pwdInput && pwdIcon) {
      toggleBtn.addEventListener('click', function() {
        const isPassword = pwdInput.type === 'password';
        pwdInput.type = isPassword ? 'text' : 'password';
        pwdIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
      });
    }
  })();
</script></main></body></html>

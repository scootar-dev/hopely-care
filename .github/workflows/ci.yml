name: Hopely checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  ai:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install '.[dev]'
      - run: ruff check app tests
      - run: pytest -q
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, mysql]
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: hopely_test
          MYSQL_ROOT_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      DB_CONNECTION: ${{ matrix.database }}
      DB_DATABASE: ${{ matrix.database == 'mysql' && 'hopely_test' || ':memory:' }}
      DB_HOST: 127.0.0.1
      DB_USERNAME: root
      DB_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, pdo_mysql
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: vendor/bin/phpunit
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: {channel: stable}
      - run: flutter pub get
        working-directory: mobile
      - run: flutter analyze
        working-directory: mobile
      - run: flutter test
        working-directory: mobile
      - run: flutter build apk --debug --dart-define=API_BASE_URL=http://10.0.2.2:8000/api
        working-directory: mobile
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stitch-v2-screens
          path: mobile/test-output/*.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: hopely-care-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
